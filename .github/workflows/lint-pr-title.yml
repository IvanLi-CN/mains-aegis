name: lint-pr-title

on:
  pull_request:

permissions:
  contents: read
  pull-requests: read

jobs:
  lint:
    name: PR title lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Setup bun
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python3 tools/ci/download-release-asset.py oven-sh/bun bun-v1.3.6 \
            bun-linux-x64.zip "$RUNNER_TEMP/bun.zip"
          unzip -q "$RUNNER_TEMP/bun.zip" -d "$RUNNER_TEMP/bun"
          echo "$RUNNER_TEMP/bun/bun-linux-x64" >> "$GITHUB_PATH"
      - name: Install JS dev tools
        run: bun install --frozen-lockfile
      - name: Lint PR title
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: |
          set -euo pipefail
          tmp="$(mktemp)"
          printf "%s\n" "$PR_TITLE" > "$tmp"
          bun run commitlint -- --edit "$tmp"
