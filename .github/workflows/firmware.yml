name: firmware

on:
  push:
    branches: ["main"]
    paths-ignore:
      - "docs/**"
      - "docs-site/**"
      - "README.md"
  pull_request:
    paths-ignore:
      - "docs/**"
      - "docs-site/**"
      - "README.md"

permissions:
  contents: write
  pull-requests: read

jobs:
  build:
    name: Firmware quality (ESP32-S3)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive
      - name: Paths filter (skip if no firmware changes)
        id: changes
        uses: dorny/paths-filter@v4
        with:
          filters: |
            firmware:
              - "firmware/**"
              - ".gitmodules"
              - "tps55288"
              - "ina3221-async"
              - "tools/firmware-artifact/**"
              - ".github/workflows/firmware.yml"
      - name: Skip (no firmware changes)
        if: steps.changes.outputs.firmware != 'true'
        run: echo "No firmware changes; skip build."

      - name: Install ESP Xtensa toolchain (esp)
        if: steps.changes.outputs.firmware == 'true'
        uses: esp-rs/xtensa-toolchain@v1.5
        with:
          default: true
          buildtargets: esp32s3
          version: latest
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Install esptool
        if: steps.changes.outputs.firmware == 'true'
        run: python3 -m pip install --user --break-system-packages esptool

      - name: cargo clippy (firmware)
        if: steps.changes.outputs.firmware == 'true'
        run: |
          cd firmware
          cargo clippy

      - name: cargo build (firmware)
        if: steps.changes.outputs.firmware == 'true'
        run: |
          cd firmware
          cargo build

      - name: cargo build release web_serial artifact
        if: steps.changes.outputs.firmware == 'true'
        run: |
          cd firmware
          cargo build --release --bin esp-firmware --features net_http,web_serial
          cd ..
          python3 -m esptool --chip esp32s3 elf2image \
            --flash-mode dio \
            --flash-freq 80m \
            --flash-size 4MB \
            --output firmware/target/xtensa-esp32s3-none-elf/release/esp-firmware.bin \
            firmware/target/xtensa-esp32s3-none-elf/release/esp-firmware
          python3 tools/firmware-artifact/build-catalog-entry.py \
            --elf firmware/target/xtensa-esp32s3-none-elf/release/esp-firmware \
            --image 0x10000:firmware/target/xtensa-esp32s3-none-elf/release/esp-firmware.bin \
            --out firmware/target/mains-aegis-artifacts \
            --features net_http,web_serial \
            --profile release
          python3 tools/firmware-artifact/embed-web-assets.py \
            --catalog firmware/target/mains-aegis-artifacts/firmware-catalog.json \
            --out web/public/firmware \
            --clean

      - name: Upload firmware artifacts
        if: steps.changes.outputs.firmware == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: mains-aegis-firmware-catalog
          path: |
            firmware/target/mains-aegis-artifacts/*
            web/public/firmware/*

      - name: Publish GitHub Release firmware catalog
        if: steps.changes.outputs.firmware == 'true' && github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          release_tag="firmware-${GITHUB_SHA}"
          release_title="Mains Aegis firmware catalog"
          release_notes="Automated firmware catalog for ${GITHUB_SHA}."
          assets=(firmware/target/mains-aegis-artifacts/*)

          if gh release view "$release_tag" >/dev/null 2>&1; then
            gh release upload "$release_tag" "${assets[@]}" --clobber
            gh release edit "$release_tag" --title "$release_title" --notes "$release_notes"
          else
            gh release create "$release_tag" "${assets[@]}" --title "$release_title" --notes "$release_notes"
          fi
