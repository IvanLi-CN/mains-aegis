name: firmware

on:
  push:
    branches: ["main"]
    paths-ignore:
      - "docs/**"
      - "docs-site/**"
      - "README.md"
  pull_request:
    paths-ignore:
      - "docs/**"
      - "docs-site/**"
      - "README.md"

permissions:
  contents: read
  pull-requests: read

jobs:
  build:
    name: Firmware quality (ESP32-S3)
    runs-on: ubuntu-latest
    outputs:
      firmware_changed: ${{ steps.changes.outputs.firmware }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          submodules: recursive
      - name: Paths filter (skip if no firmware changes)
        id: changes
        uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4
        with:
          filters: |
            firmware:
              - "firmware/**"
              - "tools/bq40-comm-tool/**"
              - "Justfile"
              - ".gitmodules"
              - "tps55288"
              - "ina3221-async"
              - "tools/firmware-artifact/**"
              - "web/public/firmware/**"
              - ".github/workflows/firmware.yml"
      - name: Skip (no firmware changes)
        if: steps.changes.outputs.firmware != 'true'
        run: echo "No firmware changes; skip build."

      - name: Install ESP Xtensa toolchain (esp)
        if: steps.changes.outputs.firmware == 'true'
        uses: esp-rs/xtensa-toolchain@b989c80ffd4be88d30c09606ee9b449bd0d41958 # v1.5
        with:
          default: true
          buildtargets: esp32s3
          version: latest
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Install esptool
        if: steps.changes.outputs.firmware == 'true'
        run: python3 -m pip install --user --break-system-packages esptool

      - name: cargo clippy (firmware)
        if: steps.changes.outputs.firmware == 'true'
        run: |
          cd firmware
          cargo clippy

      - name: cargo build (firmware)
        if: steps.changes.outputs.firmware == 'true'
        run: |
          cd firmware
          cargo build

      - name: cargo check (bq40 comm-tool charge profile)
        if: steps.changes.outputs.firmware == 'true'
        run: |
          cd tools/bq40-comm-tool/firmware
          cargo +esp check --features bms-rom-recover-disable,bms-charge-temperature-profile,bms-charge-temperature-apply
          cargo +esp check --features bms-rom-recover-force
          cargo +esp check --features bms-df-repair-afe-default
          cargo +esp check --features bms-rom-repair-asset-df-mainboard

      - name: bq40 charge profile contract gate
        if: steps.changes.outputs.firmware == 'true'
        run: |
          sudo apt-get update
          sudo apt-get install -y ripgrep
          rustc --edition=2021 --test tools/bq40-comm-tool/firmware/src/charge_profile.rs \
            -o /tmp/mains-aegis-bq40-charge-profile-test
          /tmp/mains-aegis-bq40-charge-profile-test
          bash tools/bq40-comm-tool/bin/profile-contract-test.sh

      - name: cargo build release web_serial artifact
        if: steps.changes.outputs.firmware == 'true'
        run: |
          cd firmware
          cargo build --release --bin mains-aegis-firmware --features net_http,web_serial
          cd ..
          python3 -m esptool --chip esp32s3 elf2image \
            --flash-mode dio \
            --flash-freq 80m \
            --flash-size 4MB \
            --output firmware/target/xtensa-esp32s3-none-elf/release/mains-aegis-firmware.bin \
            firmware/target/xtensa-esp32s3-none-elf/release/mains-aegis-firmware
          python3 tools/firmware-artifact/build-catalog-entry.py \
            --elf firmware/target/xtensa-esp32s3-none-elf/release/mains-aegis-firmware \
            --image 0x10000:firmware/target/xtensa-esp32s3-none-elf/release/mains-aegis-firmware.bin \
            --out firmware/target/mains-aegis-artifacts \
            --features net_http,web_serial \
            --profile release \
            --output-stem mains-aegis-firmware-12v

      - name: Validate committed bundled firmware assets
        if: steps.changes.outputs.firmware == 'true'
        run: |
          python3 tools/firmware-artifact/validate-web-bundle.py --bundle-root web/public/firmware

      - name: Build generated bundled firmware assets
        if: steps.changes.outputs.firmware == 'true'
        run: |
          python3 tools/firmware-artifact/embed-web-assets.py \
            --catalog firmware/target/mains-aegis-artifacts/firmware-catalog.json \
            --out /tmp/mains-aegis-web-public-firmware \
            --clean
          python3 tools/firmware-artifact/validate-web-bundle.py \
            --bundle-root /tmp/mains-aegis-web-public-firmware

      - name: Upload firmware artifacts
        if: steps.changes.outputs.firmware == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: mains-aegis-firmware-catalog
          path: |
            firmware/target/mains-aegis-artifacts/*
            /tmp/mains-aegis-web-public-firmware/*

      - name: Upload firmware release assets
        if: steps.changes.outputs.firmware == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: mains-aegis-firmware-release-assets
          path: firmware/target/mains-aegis-artifacts/*
          if-no-files-found: error

  publish-release:
    name: Publish GitHub Release firmware catalog
    needs: build
    if: needs.build.outputs.firmware_changed == 'true' && github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: read
    steps:
      - name: Download firmware release assets
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: mains-aegis-firmware-release-assets
          path: release-assets

      - name: Publish GitHub Release firmware catalog
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          release_tag="firmware-${GITHUB_SHA}"
          release_title="Mains Aegis firmware catalog"
          release_notes="Automated firmware catalog for ${GITHUB_SHA}."
          assets=(release-assets/*)

          if gh release view "$release_tag" >/dev/null 2>&1; then
            tag_ref="refs/tags/${release_tag}"
            tag_object_type="$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/${tag_ref}" --jq '.object.type')"
            tag_object_sha="$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/${tag_ref}" --jq '.object.sha')"
            if [[ "$tag_object_type" == "tag" ]]; then
              tag_object_sha="$(gh api "repos/${GITHUB_REPOSITORY}/git/tags/${tag_object_sha}" --jq '.object.sha')"
            fi
            if [[ "$tag_object_sha" != "$GITHUB_SHA" ]]; then
              echo "Release tag ${release_tag} points to ${tag_object_sha}, expected ${GITHUB_SHA}."
              exit 1
            fi
            gh release upload "$release_tag" "${assets[@]}" --clobber
            gh release edit "$release_tag" --title "$release_title" --notes "$release_notes"
          else
            gh release create "$release_tag" "${assets[@]}" --target "$GITHUB_SHA" --title "$release_title" --notes "$release_notes"
          fi
