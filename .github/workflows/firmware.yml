name: firmware

on:
  push:
    branches: ["main"]
    paths-ignore:
      - "docs/**"
      - "docs-site/**"
      - "README.md"
  pull_request:
    paths-ignore:
      - "docs/**"
      - "docs-site/**"
      - "README.md"

permissions:
  contents: read
  pull-requests: read

jobs:
  build:
    name: Firmware quality (ESP32-S3)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Paths filter (skip if no firmware changes)
        id: changes
        uses: dorny/paths-filter@v3
        with:
          filters: |
            firmware:
              - "firmware/**"
              - ".gitmodules"
              - "tps55288"
              - "ina3221-async"
              - "tools/firmware-artifact/**"
              - ".github/workflows/firmware.yml"
      - name: Skip (no firmware changes)
        if: steps.changes.outputs.firmware != 'true'
        run: echo "No firmware changes; skip build."

      - name: Install ESP Xtensa toolchain (esp)
        if: steps.changes.outputs.firmware == 'true'
        uses: esp-rs/xtensa-toolchain@v1.5
        with:
          default: true
          buildtargets: esp32s3
          version: latest
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: cargo clippy (firmware)
        if: steps.changes.outputs.firmware == 'true'
        run: |
          cd firmware
          cargo clippy

      - name: cargo build (firmware)
        if: steps.changes.outputs.firmware == 'true'
        run: |
          cd firmware
          cargo build

      - name: cargo build release web_serial artifact
        if: steps.changes.outputs.firmware == 'true'
        run: |
          cd firmware
          cargo build --release --bin esp-firmware --features web_serial
          cd ..
          python3 tools/firmware-artifact/build-catalog-entry.py \
            --elf firmware/target/xtensa-esp32s3-none-elf/release/esp-firmware \
            --out firmware/target/mains-aegis-artifacts \
            --features web_serial \
            --profile release
          python3 tools/firmware-artifact/embed-web-assets.py \
            --catalog firmware/target/mains-aegis-artifacts/firmware-catalog.json \
            --out web/public/firmware \
            --clean

      - name: Upload firmware artifacts
        if: steps.changes.outputs.firmware == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: mains-aegis-firmware-catalog
          path: |
            firmware/target/mains-aegis-artifacts/*
            web/public/firmware/*
