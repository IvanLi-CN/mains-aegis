name: docs-pages

on:
  pull_request:
    branches: [main]
    paths:
      - "package.json"
      - "bun.lock"
      - "web/**"
      - "docs-site/**"
      - "tools/pages/**"
      - ".github/workflows/docs-pages.yml"
  push:
    branches: [main]
    paths:
      - "package.json"
      - "bun.lock"
      - "web/**"
      - "docs-site/**"
      - "tools/pages/**"
      - ".github/workflows/docs-pages.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: docs-pages-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build-pages:
    runs-on: ubuntu-latest
    env:
      PAGES_BASE_OVERRIDE: ${{ vars.PAGES_BASE }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.9

      - name: Compute Pages bases
        shell: bash
        run: |
          set -euo pipefail
          owner="${GITHUB_REPOSITORY%%/*}"
          repo="${GITHUB_REPOSITORY##*/}"
          normalize_base() {
            local raw="${1:-/}"
            if [[ "${raw}" == "." || "${raw}" == "./" ]]; then
              printf './'
              return
            fi
            if [[ -z "${raw}" || "${raw}" == "/" ]]; then
              printf '/'
              return
            fi
            [[ "${raw}" == /* ]] || raw="/${raw}"
            [[ "${raw}" == */ ]] || raw="${raw}/"
            printf '%s' "${raw}"
          }
          if [[ -n "${PAGES_BASE_OVERRIDE}" ]]; then
            pages_base="$(normalize_base "${PAGES_BASE_OVERRIDE}")"
          else
            pages_base="./"
          fi
          if [[ "${pages_base}" == "./" ]]; then
            docs_base="/docs/"
          else
            docs_base="${pages_base}docs/"
          fi
          echo "PAGES_BASE=${pages_base}" >> "$GITHUB_ENV"
          echo "DOCS_BASE=${docs_base}" >> "$GITHUB_ENV"
          echo "PAGES_REPO=${repo}" >> "$GITHUB_ENV"

      - name: Install web dependencies
        run: bun install --frozen-lockfile

      - name: Install docs dependencies
        run: bun install --cwd docs-site --frozen-lockfile

      - name: Build web app
        shell: bash
        run: |
          set -euo pipefail
          PAGES_BASE="${PAGES_BASE}" bun run web:build
          node tools/pages/write-spa-fallback.mjs web/dist/404.html "${PAGES_REPO}" "${PAGES_BASE}"

      - name: Build docs site
        shell: bash
        run: |
          set -euo pipefail
          cd docs-site
          DOCS_BASE="${DOCS_BASE}" bun run build

      - name: Publish docs under web app
        shell: bash
        run: |
          set -euo pipefail
          rm -rf web/dist/docs
          mkdir -p web/dist/docs
          cp -R docs-site/doc_build/. web/dist/docs/
          node tools/pages/relativize-docs-html.mjs web/dist/docs "${DOCS_BASE}"

      - name: Smoke check build output
        shell: bash
        run: |
          set -euo pipefail
          test -f web/dist/index.html
          test -f web/dist/404.html
          test -f web/dist/manifest.webmanifest
          test -f web/dist/sw.js
          test -f web/dist/pwa-navigation-fallback.js
          test -f web/dist/pwa/mains-aegis-icon-192.png
          test -f web/dist/pwa/mains-aegis-icon-512.png
          test -d web/dist/assets
          grep -q 'spa_path' web/dist/404.html
          grep -q 'manifest.webmanifest' web/dist/index.html
          grep -q 'pwa-navigation-fallback.js' web/dist/sw.js
          grep -q 'mains-aegis-icon-192.png' web/dist/manifest.webmanifest
          grep -q 'firmware-catalog.json' web/dist/sw.js
          grep -q 'mains-aegis-firmware.bin' web/dist/sw.js
          test -f docs-site/doc_build/index.html
          test -f docs-site/doc_build/404.html
          test -d docs-site/doc_build/static
          test -f docs-site/doc_build/design/system-overview.html
          test -f docs-site/doc_build/manual/basic-use-and-troubleshooting.html
          test -f web/dist/docs/index.html
          test -f web/dist/docs/404.html
          test -d web/dist/docs/static
          test -f web/dist/docs/design/system-overview.html
          test -f web/dist/docs/manual/basic-use-and-troubleshooting.html
          grep -q 'src="./assets/' web/dist/index.html
          grep -q 'href="./assets/' web/dist/index.html
          grep -q 'src="./static/' web/dist/docs/index.html
          grep -q 'href="./static/' web/dist/docs/index.html
          grep -q 'src="../static/' web/dist/docs/design/system-overview.html
          grep -q 'href="../static/' web/dist/docs/design/system-overview.html
          ! grep -q '="/mains-aegis/' web/dist/index.html
          ! grep -q '="/mains-aegis/' web/dist/docs/index.html
          ! grep -q '="/static/' web/dist/docs/index.html
          ! grep -q '="/static/' web/dist/docs/design/system-overview.html
          ! grep -q '="/brand/' web/dist/docs/index.html
          ! grep -q '="/index.html' web/dist/docs/index.html
          ! grep -q '="/docs/' web/dist/docs/index.html
          ! grep -q '="/docs/' web/dist/docs/design/system-overview.html

      - name: Upload build artifact (PR only)
        if: ${{ github.event_name == 'pull_request' }}
        uses: actions/upload-artifact@v7
        with:
          name: pages-build
          path: web/dist
          retention-days: 7
          if-no-files-found: error

      - name: Upload Pages artifact
        if: ${{ github.event_name != 'pull_request' && github.ref == 'refs/heads/main' }}
        uses: actions/upload-pages-artifact@v5
        with:
          path: web/dist

  deploy:
    if: ${{ github.event_name != 'pull_request' && github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    needs: [build-pages]
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Setup Pages
        uses: actions/configure-pages@v6

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
